<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', Arial, sans-serif;
    background: linear-gradient(160deg, #eefaff 0%, #ffffff 46%, #e2f8fd 100%);
    color: #0b1f33;
    position: relative;
    display: flex; flex-direction: column;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .g1 { width: 520px; height: 520px; right: -140px; top: -220px; background: rgba(0, 175, 198, .16); }
  .g2 { width: 460px; height: 460px; left: -160px; bottom: -200px; background: rgba(56, 217, 169, .14); }

  .wrap { position: relative; flex: 1 1 auto; min-height: 0; padding: 44px 56px 0; }

  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo svg { height: 84px; width: auto; display: block; filter: drop-shadow(0 6px 18px rgba(7, 36, 58, .10)); }
  .pill {
    font: 800 15px/1 'Inter'; letter-spacing: 3px; text-transform: uppercase; color: #007c91;
    border: 2px solid rgba(0, 175, 198, .45); background: rgba(255, 255, 255, .75);
    padding: 12px 20px; border-radius: 999px;
  }

  h1 { font: 900 60px/1.08 'Outfit'; letter-spacing: -1.5px; margin-top: 42px; max-width: 1050px; }
  h1 .teal { color: #008da1; }
  .sub { font: 600 23px/1.35 'Inter'; color: #46607a; margin-top: 14px; }

  .stats { display: flex; gap: 20px; margin-top: 34px; }
  .stat {
    flex: 1; background: #ffffff; border: 1px solid rgba(7, 36, 58, .08); border-radius: 22px;
    padding: 22px 26px; box-shadow: 0 14px 34px rgba(7, 36, 58, .08);
    border-top: 4px solid #00afc6;
  }
  .stat .num { font: 900 50px/1 'Outfit'; color: #008da1; letter-spacing: -1px; }
  .stat .lbl { font: 700 14.5px/1.25 'Inter'; letter-spacing: 1.6px; text-transform: uppercase; color: #46607a; margin-top: 9px; }

  .bar {
    position: relative; z-index: 5; flex: 0 0 64px; background: #0b1f33;
    display: flex; align-items: center; justify-content: space-between; padding: 0 56px;
  }
  .bar .site { font: 800 24px/1 'Outfit'; color: #ffffff; letter-spacing: .5px; }
  .bar .site span { color: #38d9a9; }
  .bar .tag { font: 700 15px/1 'Inter'; letter-spacing: 3px; text-transform: uppercase; color: #7fd7e4; }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="wrap">
    <div class="top">
      <div class="logo"><svg width="720" height="240" viewBox="0 0 720 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="720" height="240" rx="48" fill="#F7FCFF"/>
        <circle cx="118" cy="120" r="78" fill="#E6FAFF"/>
        <path d="M118 42L181 67V112C181 156 154 190 118 202C82 190 55 156 55 112V67L118 42Z" fill="white" stroke="#07243A" stroke-width="10" stroke-linejoin="round"/>
        <path d="M79 130C96 105 121 95 154 100" stroke="#00AFC6" stroke-width="14" stroke-linecap="round"/>
        <path d="M78 152C103 134 134 130 161 139" stroke="#38D9A9" stroke-width="14" stroke-linecap="round"/>
        <path d="M96 107L118 82L140 107" stroke="#07243A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M118 84V146" stroke="#07243A" stroke-width="12" stroke-linecap="round"/>
        <circle cx="118" cy="151" r="11" fill="#FF7A1A"/>
        <path d="M205 72H254" stroke="#00AFC6" stroke-width="10" stroke-linecap="round"/>
        <path d="M205 96H286" stroke="#38D9A9" stroke-width="10" stroke-linecap="round"/>
        <text x="320" y="112" fill="#07243A" font-family="Outfit, Inter, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="-2">LSA</text>
        <text x="320" y="166" fill="#07243A" font-family="Outfit, Inter, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">Command</text>
        <text x="323" y="195" fill="#007C91" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="4">SPEED-TO-LEAD AI</text>
      </svg></div>
      <div class="pill">Google Local Services Ads</div>
    </div>

    <h1>Never Miss Another <span class="teal">Google LSA Lead.</span></h1>
    <div class="sub">AI answers every call &amp; message in seconds — 24/7. Junk leads get refunded.</div>

    <div class="stats">
      <div class="stat"><div class="num">300%</div><div class="lbl">More LSA Leads</div></div>
      <div class="stat"><div class="num">100%</div><div class="lbl">Response Rate</div></div>
      <div class="stat"><div class="num">+70%</div><div class="lbl">Lead Quality Lift</div></div>
    </div>
  </div>

  <div class="bar">
    <div class="site">lsacommand<span>.com</span></div>
    <div class="tag">Response &middot; Reviews &middot; Radius</div>
  </div>
</body>
</html>
